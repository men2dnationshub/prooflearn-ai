name: ProofLearn validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app.py pages modules scripts tests ui utils
      - name: Run automated tests
        run: python -m pytest -q
      - name: Check prototype release readiness
        run: python scripts/release_check.py
      - name: Check demo deployment readiness
        run: python scripts/deployment_check.py
